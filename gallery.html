<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF--8">
    <title>Gallery Proyek</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .carousel-item img {
            max-height: 450px;
            object-fit: contain;
            margin: auto;
        }
        .carousel-control-prev-icon,
        .carousel-control-next-icon {
            filter: invert(1);
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }
        .carousel-control-prev:hover .carousel-control-prev-icon,
        .carousel-control-next:hover .carousel-control-next-icon {
            opacity: 1;
        }
        .carousel {
            background-color: #e9ecef;
            border-radius: 8px;
        }
        .project-title {
            margin-top: 0;
            margin-bottom: 1rem;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <h2>Gallery Proyek Saya</h2>
        <hr>
        <div class="project-item mb-5">
            <h3 class="project-title" id="kantin">1. Aplikasi Rekomendasi Kantin</h3>
            <div id="carouselKantin" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="GalleryPhoto/VRC_splash.png" class="d-block w-100" alt="Kantin 1">
                    </div>
                    <div class="carousel-item">
                        <img src="GalleryPhoto/VRC_login.png" class="d-block w-100" alt="Kantin 2">
                    </div>
                    <div class="carousel-item">
                        <img src="GalleryPhoto/VRC_home.png" class="d-block w-100" alt="Kantin 3">
                    </div>
                    <div class="carousel-item">
                        <img src="GalleryPhoto/VRC_favorite.png" class="d-block w-100" alt="Kantin 4">
                    </div>
                    <div class="carousel-item">
                        <img src="GalleryPhoto/VRC_menu.png" class="d-block w-100" alt="Kantin 5">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselKantin" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselKantin" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>
        <div class="project-item mb-5">
            <h3 class="project-title" id="game">2. Demo Game 2D Platformer</h3>
            <div id="carouselGame" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="GalleryPhoto/LEH_main.png" class="d-block w-100" alt="Game 1">
                    </div>
                    <div class="carousel-item">
                        <img src="GalleryPhoto/LEH_tutor.png" class="d-block w-100" alt="Game 2">
                    </div>
                    <div class="carousel-item">
                        <img src="GalleryPhoto/LEH_gameplay1.png" class="d-block w-100" alt="Game 3">
                    </div>
                    <div class="carousel-item">
                        <img src="GalleryPhoto/LEH_gameplay2.png" class="d-block w-100" alt="Game 4">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselGame" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselGame" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>
        <div class="project-item mb-5">
            <h3 class="project-title" id="gym">3. Aplikasi Panduan Gym dengan AR</h3>
            <div id="carouselGym" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="GalleryPhoto/GD_workspace.png" class="d-block w-100" alt="Gym 1">
                    </div>
                    <div class="carousel-item">
                        <img src="GalleryPhoto/GD_howtouse.png" class="d-block w-100" alt="Gym 2">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselGym" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselGym" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
