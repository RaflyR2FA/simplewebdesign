        .carousel-control-prev:hover .carousel-control-prev-icon,
        .carousel-control-next:hover .carousel-control-next-icon {

        }
        .navbar-nav .nav-link.active {

            color: #ffffff !important;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
        }
        .sticky-top {
            position: sticky;
            top: 0;
            z-index: 1020;
        }
        body.sticky-nav-active {
            padding-top: 56px;
        }
        footer {
            background-color: #343a40;
            color: white;
            padding: 20px 0;
            text-align: center;
            margin-top: auto;
        }
        a {
            color: #007bff;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        a:hover {
            color: black;
            text-decoration: underline;
            transition: color 0.3s ease;
        }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>
    <script>
        const navLinks = document.querySelectorAll('#navbarNav .nav-link');
        const mainContentFrame = document.getElementById('mainContentFrame');
        const navbarBrand = document.querySelector('.navbar-brand');
        function updateActiveNav() {
            const currentSrc = mainContentFrame.contentWindow.location.pathname.split('/').pop();
            navLinks.forEach(link => link.classList.remove('active'));
            navLinks.forEach(link => {
                if (link.getAttribute('href') === currentSrc) {
                    link.classList.add('active');
                }
            });
        }
        function onIframeLoad() {
            updateActiveNav();
            setTimeout(() => {
                try {
                    mainContentFrame.style.height = 'auto';
                    const newHeight = mainContentFrame.contentWindow.document.documentElement.scrollHeight;
                    mainContentFrame.style.height = newHeight + 'px';
                    const hash = mainContentFrame.contentWindow.location.hash;
                    if (hash) {
                        const targetElement = mainContentFrame.contentWindow.document.querySelector(hash);
                        if (targetElement) {
                            targetElement.scrollIntoView({ behavior: 'smooth' });
                        }
                    }
                } catch (e) {
                    console.warn("Gagal menyesuaikan iframe:", e);
                }
            }, 0);
        }
        mainContentFrame.addEventListener('load', onIframeLoad);
        navbarBrand.addEventListener('click', () => {
            navLinks.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('href') === 'home.html') {
                    link.classList.add('active');
                }
            });
        });
        document.addEventListener('DOMContentLoaded', () => {
            const defaultNavLink = document.querySelector('.navbar-nav .nav-link[href="home.html"]');
            if (defaultNavLink) {
                defaultNavLink.classList.add('active');
            }
        });
        window.addEventListener('resize', onIframeLoad);
    </script>
